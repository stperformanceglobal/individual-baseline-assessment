:root{
  /* The palette is fixed. This tool must look identical on every device,
     so the OS dark-mode setting is explicitly opted out of rather than
     inherited. Without this, iOS darkens the page canvas while the panels
     keep their declared white, and the navy headings vanish. */
  color-scheme: only light;
  --brand:#182C4D; --brand-dark:#0F1D33; --brand-panel:#24365A; --ink-head:#16233B;
  --bg:#F4F2ED; --surface:#FFFFFF; --surface-2:#EAE6DD; --surface-3:#E1DCD1;
  --text:#2C3138; --text-2:#5A616B; --text-3:#858C96;
  --border:#DCD7CB; --border-2:#C3BCAC;
  --gold:#EAC148; --bronze:#A8791A;
  --good:#2E6B41; --good-bg:#E4EDE4;
  --warn:#B4661C; --warn-bg:#F5E9D8;
  --bad:#A33A32;  --bad-bg:#F6E7E4;
  --info:#24487A; --info-bg:#E7ECF4;
  --r-sm:6px; --r-md:10px; --r-lg:14px;
  --shell:720px;
}

*{box-sizing:border-box}
html{
  -webkit-text-size-adjust:100%;
  color-scheme: only light;
  background:var(--bg);
}
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:"Archivo",system-ui,-apple-system,sans-serif;
  font-size:16px; line-height:1.55;
  overflow-x:clip; /* clip, not hidden: hidden makes body the scroll container and breaks window.scrollTo */
}
h1,h2,h3,.dv{font-family:"Bricolage Grotesque","Archivo",sans-serif;font-weight:700;letter-spacing:-.02em;color:var(--ink-head);line-height:1.15}
h1{font-size:28px;margin:0 0 10px}
h2{font-size:21px;margin:0 0 6px}
h3{font-size:16px;margin:0 0 4px}
p{margin:0 0 12px}
a{color:var(--info)}
button{font-family:inherit;font-size:inherit;cursor:pointer}
:focus-visible{outline:2.5px solid var(--bronze);outline-offset:2px;border-radius:3px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* Some in-app webviews apply a dark treatment regardless of color-scheme.
   Re-declare every surface and text colour so the result is unchanged. */
@media (prefers-color-scheme:dark){
  :root,html,body{color-scheme:only light}
  html,body{background:var(--bg);color:var(--text)}
  h1,h2,h3,.dv,.area h3,.choice b,.row .nm b,.pick label b,.quote b{color:var(--ink-head)}
  .lede,.area .desc,.area .q,.choice span,.row .nm span{color:var(--text-2)}
  .panel{background:var(--surface);border-color:var(--border)}
  .panel.flat{background:var(--surface-2);border-color:var(--border-2)}
  .sc{background:var(--surface-2);color:var(--text-2);border-color:var(--border-2)}
  .sc .n{color:var(--ink-head)}
  .sc[aria-pressed=true]{background:var(--brand);color:#fff}
  .sc[aria-pressed=true] .n{color:#fff}
  input[type=text],textarea,select{background:var(--surface);color:var(--text);border-color:var(--border-2)}
  .nav{background:rgba(244,242,237,.96)}
  .btn{background:var(--brand);color:#fff}
  .btn.ghost{background:transparent;color:var(--brand)}
  .btn.gold{background:var(--bronze);color:#fff}
  footer{color:var(--text-3)}
}

/* ---------- chrome ---------- */
.top{
  position:sticky;top:0;z-index:40;background:var(--brand);color:#EDEAE2;
  padding:calc(10px + env(safe-area-inset-top)) 16px 10px;
  display:flex;align-items:center;gap:12px;
}
.top img:not(#printlogo){height:38px;width:auto;display:block;flex:none}
.top .ttl{font-family:"Bricolage Grotesque",sans-serif;font-weight:700;font-size:15px;
  letter-spacing:-.015em;color:#F2EFE7;line-height:1.15;white-space:nowrap;flex:none}
.top .ttl span{display:block;font-family:"Archivo",sans-serif;font-weight:400;font-size:11.5px;color:var(--gold);letter-spacing:.01em}
.top .who{margin-left:auto;text-align:right;font-size:12px;line-height:1.3;color:#B9C2D0;min-width:0}
.top .who,.top .who b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (max-width:430px){ .top .ttl span{display:none} .top .ttl{font-size:14px} }
@media (max-width:380px){ body.named .top .ttl{display:none} }
.top .who b{display:block;color:#F2EFE7;font-size:13px;font-weight:600}

.bar{height:3px;background:var(--surface-3);position:sticky;top:0;z-index:39}
.bar i{display:block;height:100%;background:var(--bronze);width:0;transition:width .25s ease}

.wrap{max-width:var(--shell);margin:0 auto;padding:22px 16px calc(120px + env(safe-area-inset-bottom))}

/* ---------- panels ---------- */
.panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:20px;margin:0 0 16px}
.panel.flat{background:var(--surface-2);border-color:var(--border-2)}
.note{background:var(--info-bg);border-left:3px solid var(--info);border-radius:0 var(--r-sm) var(--r-sm) 0;padding:12px 14px;font-size:14px;line-height:1.55;margin:0 0 14px}
.note.gold{background:#F8F2E0;border-left-color:var(--bronze)}
.note b{color:var(--ink-head)}
.lede{font-size:16.5px;color:var(--text-2);margin:0 0 18px;max-width:62ch}
.eyebrow{font-size:13px;color:var(--bronze);font-weight:600;margin:0 0 6px}

/* ---------- forms ---------- */
label.fld{display:block;margin:0 0 16px}
label.fld > span{display:block;font-weight:600;font-size:14.5px;color:var(--ink-head);margin:0 0 5px}
label.fld > em{display:block;font-style:normal;font-size:13.5px;color:var(--text-2);margin:0 0 7px;line-height:1.5}
input[type=text],textarea,select{
  width:100%;font-family:inherit;font-size:16px;color:var(--text);
  background:var(--surface);border:1px solid var(--border-2);border-radius:var(--r-sm);
  padding:11px 12px;
}
textarea{min-height:92px;resize:vertical;line-height:1.55}
input:focus,textarea:focus,select:focus{border-color:var(--bronze);outline:none;box-shadow:0 0 0 3px rgba(168,121,26,.16)}

.choices{display:grid;gap:8px}
.choice{
  display:block;width:100%;text-align:left;background:var(--surface);color:var(--text);
  border:1.5px solid var(--border-2);border-radius:var(--r-md);padding:13px 15px;
}
.choice b{display:block;font-family:"Bricolage Grotesque",sans-serif;font-weight:700;font-size:15.5px;color:var(--ink-head);letter-spacing:-.01em}
.choice span{display:block;font-size:13.5px;color:var(--text-2);margin-top:2px;line-height:1.5}
.choice[aria-pressed=true]{border-color:var(--brand);background:var(--info-bg);box-shadow:inset 0 0 0 1px var(--brand)}

/* ---------- scoring ---------- */
.area{padding:18px 0;border-top:1px solid var(--border)}
.area:first-of-type{border-top:0;padding-top:4px}
.area h3{font-size:17px;margin:0 0 3px}
.area .desc{font-size:14px;color:var(--text-2);margin:0 0 12px;line-height:1.55;max-width:60ch}
.area .q{font-size:14px;color:var(--text-2);margin:0 0 12px;line-height:1.55;max-width:60ch;font-style:italic}

.scale{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.sc{
  background:var(--surface-2);
  color:var(--text-2);              /* explicit: inherited colour once made these invisible */
  border:1.5px solid var(--border-2);border-radius:var(--r-sm);
  padding:9px 2px 7px;text-align:center;line-height:1.15;
  display:flex;flex-direction:column;align-items:center;gap:3px;min-height:56px;justify-content:center;
}
.sc .n{font-family:"Bricolage Grotesque",sans-serif;font-weight:700;font-size:17px;color:var(--ink-head)}
.sc .t{font-size:9px;color:var(--text-3);letter-spacing:-.01em;display:none}
.sc[aria-pressed=true]{background:var(--brand);border-color:var(--brand);color:#fff}
.sc[aria-pressed=true] .n{color:#fff}
.sc[aria-pressed=true] .t{color:#D6DCE6}
.scale-key{display:flex;justify-content:space-between;font-size:11.5px;color:var(--text-3);margin-top:6px}
@media (min-width:560px){ .sc .t{display:block} .scale-key{display:none} }

.skip{margin-top:9px;font-size:13px;color:var(--text-3);background:none;border:0;padding:4px 0;text-decoration:underline}

/* ---------- nav ---------- */
.nav{
  position:fixed;left:0;right:0;bottom:0;z-index:45;
  background:rgba(244,242,237,.96);backdrop-filter:blur(8px);
  border-top:1px solid var(--border-2);
  padding:10px 16px calc(10px + env(safe-area-inset-bottom));
}
.nav .in{max-width:var(--shell);margin:0 auto;display:flex;gap:10px;align-items:center}
.btn{
  border:1.5px solid var(--brand);background:var(--brand);color:#fff;
  border-radius:var(--r-md);padding:12px 20px;font-weight:600;font-size:15.5px;
}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--brand)}
.btn.gold{background:var(--bronze);border-color:var(--bronze);color:#fff}
.btn.sm{padding:8px 14px;font-size:14px}
.nav .count{margin-left:auto;font-size:13px;color:var(--text-2);text-align:right;line-height:1.3}
.nav .count b{color:var(--ink-head)}

/* ---------- results ---------- */
.spider{width:100%;height:auto;display:block;margin:0 auto}
.legend{display:flex;gap:16px;justify-content:center;font-size:13px;color:var(--text-2);margin-top:8px;flex-wrap:wrap}
.legend i{display:inline-block;width:11px;height:11px;border-radius:2px;margin-right:5px;vertical-align:-1px}

.rows{margin:0}
.row{display:flex;align-items:center;gap:12px;padding:9px 0;border-top:1px solid var(--border);font-size:14.5px}
.row:first-child{border-top:0}
.row .nm{flex:1;min-width:0}
.row .nm b{display:block;font-weight:600;color:var(--ink-head)}
.row .nm span{display:block;font-size:12.5px;color:var(--text-3)}
.row .track{width:96px;height:7px;background:var(--surface-3);border-radius:4px;overflow:hidden;flex:none}
.row .track i{display:block;height:100%;background:var(--brand)}
.row .v{width:26px;text-align:right;font-family:"Bricolage Grotesque",sans-serif;font-weight:700;font-size:16px;color:var(--ink-head);flex:none}
.row.low .track i{background:var(--warn)}
.row.high .track i{background:var(--good)}

.stat{display:grid;grid-template-columns:repeat(auto-fit,minmax(108px,1fr));gap:10px;margin:0 0 16px}
.stat > div{background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r-md);padding:13px 14px}
.stat .dv{font-size:26px;line-height:1;color:var(--bronze)}
.stat .lb{font-size:12.5px;color:var(--text-2);margin-top:4px;line-height:1.4}

.pick{display:flex;gap:10px;align-items:flex-start;padding:11px 0;border-top:1px solid var(--border)}
.pick input{margin-top:3px;width:19px;height:19px;flex:none;accent-color:var(--bronze)}
.pick label{font-size:14.5px;line-height:1.5;cursor:pointer}
.pick label b{color:var(--ink-head)}
.pick label span{display:block;font-size:12.5px;color:var(--text-3)}

/* ---------- history ---------- */
.hist{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--border);font-size:14px}
.hist:first-child{border-top:0}
.hist .d{flex:1}
.hist .d b{display:block;color:var(--ink-head);font-weight:600}
.hist .d span{font-size:12.5px;color:var(--text-3)}

.chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 0}
.chip{background:var(--surface-2);border:1px solid var(--border-2);border-radius:100px;padding:4px 11px;font-size:12.5px;color:var(--text-2)}

.quote{border-left:3px solid var(--border-2);padding:2px 0 2px 14px;margin:0 0 14px;font-size:14.5px;line-height:1.6;color:var(--text)}
.quote b{display:block;font-size:12.5px;color:var(--text-3);font-weight:600;margin-bottom:3px}

footer{max-width:var(--shell);margin:0 auto;padding:26px 16px 40px;font-size:12.5px;color:var(--text-3);line-height:1.6}

/* ---------- print masthead ---------- */
.printhead{display:none}
@media print{
  .printhead{
    display:flex!important;align-items:center;gap:12px;
    border-bottom:2px solid var(--brand);padding:0 0 8px;margin:0 0 14px;
  }
  .printhead img{height:34px;width:auto;flex:none}
  .printhead b{font-family:"Bricolage Grotesque",sans-serif;font-size:13pt;color:var(--ink-head);display:block;line-height:1.15}
  .printhead span{display:block;font-size:8.8pt;color:var(--text-2)}
  .printhead .rt{margin-left:auto;text-align:right;font-family:"Bricolage Grotesque",sans-serif;
    font-weight:700;font-size:10pt;color:var(--bronze);line-height:1.2}
  .printhead .rt span{font-family:"Archivo",sans-serif;font-weight:400;font-size:8pt;color:var(--text-3)}
}

/* ---------- print ---------- */
@page{size:A4;margin:14mm 13mm}
@media print{
  .top,.nav,.bar,.noprint{display:none!important}
  body{background:#fff;font-size:10.5pt}
  .wrap{max-width:none;padding:0}
  .panel{border:1px solid #CFCABE;border-radius:6px;padding:12px 14px;margin:0 0 10px;break-inside:avoid;page-break-inside:avoid}
  h1{font-size:19pt}h2{font-size:13.5pt}h3{font-size:11pt}
  .row,.area,.pick{break-inside:avoid;page-break-inside:avoid}
  .spider{max-width:116mm;margin:0 auto}
  .pb{break-before:page;page-break-before:always}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>

<script>
/* ===========================================================================
   ST Performance Global — Individual Baseline
   Second arm: people who come directly for mentoring, coaching and development
   support. No organisation, no manager, no aggregate. One person, one baseline.

   Everything is stored in localStorage on this device. Nothing is transmitted.
   The person exports a PDF or a data file and sends it wherever they choose.
   =========================================================================== */

'use strict';

/* ---------- roles ------------------------------------------------------- */
const ROLES = [
  { id:'director', label:'Director', framework:'leadership', needsDiscipline:false,
    blurb:'You lead the whole performance function.' },
  { id:'department_manager', label:'Department Manager', framework:'leadership', needsDiscipline:true,
    blurb:'You lead the people within one discipline.' },
  { id:'discipline_lead', label:'Discipline Lead', framework:'delivery', needsDiscipline:true,
    blurb:'You lead the craft within one discipline rather than the people.' },
  { id:'practitioner', label:'Practitioner', framework:'delivery', needsDiscipline:true,
    blurb:'You deliver in one discipline.' }
];
const DISCIPLINES = [
  { id:'sc', label:'Strength & Conditioning' },
  { id:'science', label:'Sport Science' },
  { id:'medical', label:'Medical' },
  { id:'nutrition', label:'Nutrition' },
  { id:'mental', label:'Mental Skills' }
];
const roleById = id => ROLES.find(r => r.id === id);
const discById = id => DISCIPLINES.find(d => d.id === id);

/* ---------- framework assembly ------------------------------------------ */
function disciplineTaxonomy(dept){
  const d = DISCIPLINE_PILLARS[dept] || DISCIPLINE_PILLARS.sc;
  return [d, DELIVERY_PILLAR, UNIVERSAL_PILLAR];
}
const DESC = Object.assign({}, PERSONAL_DESCRIPTIONS, PRO_DESCRIPTIONS,
                           DISCIPLINE_DESCRIPTIONS, LEADERSHIP_DESCRIPTIONS);
const QUES = Object.assign({}, DISCIPLINE_QUESTIONS);

/* Professional pillars for the current setup, including the optional
   second set for people sitting between craft and leadership. */
function proPillars(s){
  const r = roleById(s.role); if (!r) return [];
  const base = r.framework === 'leadership'
    ? LEADERSHIP_TAXONOMY
    : disciplineTaxonomy(s.discipline);
  if (!s.addOn) return base;
  const extra = r.framework === 'leadership'
    ? disciplineTaxonomy(s.discipline)
    : LEADERSHIP_TAXONOMY;
  return base.concat(extra);
}
const personalIds = () => PERSONAL_TAXONOMY.flatMap(c => c.subs.map(x => x.id));
const proIds = s => proPillars(s).flatMap(p => p.focuses.map(f => f.id));
const allIds = s => personalIds().concat(proIds(s));

/* ---------- reflection prompts ------------------------------------------ */
const REFLECT = [
  { id:'protect', q:'What is working well right now that you would want to protect?',
    hint:'The thing you would not want a change to cost you.' },
  { id:'avoided', q:'What do you keep meaning to address and have not?',
    hint:'No need to explain why. Naming it is the useful part.' },
  { id:'sixmonths', q:'If one thing were different in six months, what would make the biggest difference?',
    hint:'One thing. The one that would change the most downstream.' },
  { id:'support', q:'What kind of support actually helps you, and what does not?',
    hint:'Being told, being asked, being left alone, being held to something. Whatever is true.' }
];

/* ---------- storage ------------------------------------------------------ */
const K_DRAFT = 'st-ib-draft', K_RECORDS = 'st-ib-records';
const readJSON = (k, fb) => { try { return JSON.parse(localStorage.getItem(k)) ?? fb; } catch(e){ return fb; } };
const writeJSON = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch(e){ return false; } };
const records = () => readJSON(K_RECORDS, []);

function blank(){
  return { id:'ib-' + Date.now().toString(36), created:new Date().toISOString(),
           updated:null, name:'', role:'', discipline:'', addOn:false, context:'',
           scores:{}, notes:{}, reflect:{}, priorities:[], health:null };
}

let S = readJSON(K_DRAFT, null) || blank();
let SCREEN = 0;
let VIEWING = null;          // a saved record being read back
let openNotes = new Set();

const save = () => { S.updated = new Date().toISOString(); writeJSON(K_DRAFT, S); };

/* ---------- screen flow -------------------------------------------------- */
function screens(){
  const list = [{ k:'intro' }, { k:'how' }];
  list.push({ k:'setup' });
  if (!S.role || (roleById(S.role).needsDiscipline && !S.discipline)) return list;
  PERSONAL_TAXONOMY.forEach((c,i) => list.push({ k:'personal', i, title:c.name }));
  proPillars(S).forEach((p,i) => list.push({ k:'pro', i, title:p.name }));
  list.push({ k:'reflect' }, { k:'physical' }, { k:'results' });
  return list;
}
const current = () => screens()[Math.min(SCREEN, screens().length - 1)];

/* ---------- small helpers ------------------------------------------------ */
const esc = t => String(t ?? '').replace(/[&<>"']/g, c =>
  ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' })[c]);
const nl = t => esc(t).replace(/\n/g, '<br>');
const mean = a => a.length ? a.reduce((x,y)=>x+y,0) / a.length : null;
const fmt1 = v => v == null ? '—' : (Math.round(v*10)/10).toFixed(1);
/* Every pillar in the extracted framework carries {id, name} focuses. The
   Python source uses [id, name, desc, question] tuples for the discipline
   pillars, so tolerate both rather than depending on which one was exported. */
const focusList = p => p.focuses.map(f => Array.isArray(f) ? { id:f[0], name:f[1] } : f);
const ALL_PILLARS = Object.keys(DISCIPLINE_PILLARS).map(d => DISCIPLINE_PILLARS[d])
  .concat([DELIVERY_PILLAR, UNIVERSAL_PILLAR], LEADERSHIP_TAXONOMY);

function areaName(id){
  for (const c of PERSONAL_TAXONOMY) for (const s of c.subs) if (s.id === id) return s.name;
  for (const p of ALL_PILLARS) for (const f of focusList(p)) if (f.id === id) return f.name;
  return id;
}
function groupName(id){
  for (const c of PERSONAL_TAXONOMY) if (c.subs.some(s => s.id === id)) return c.name;
  for (const p of ALL_PILLARS) if (focusList(p).some(f => f.id === id)) return p.name;
  return '';
}

/* ---------- radar -------------------------------------------------------- */
/* Wrap a group label to at most two lines so long pillar names ("Performance
   knowledge & application") do not run off the edge of the chart. */
function wrapLabel(text, max, maxLines){
  max = max || 16; maxLines = maxLines || 3;
  const words = String(text).split(' ');
  const lines = [''];
  for (const w of words){
    const i = lines.length - 1, line = lines[i];
    if (!line) lines[i] = w;
    else if ((line + ' ' + w).length <= max) lines[i] = line + ' ' + w;
    else if (lines.length < maxLines) lines.push(w);
    else lines[i] = line + ' ' + w;          // last line absorbs the remainder
  }
  return lines;
}

function radar(groups, scores, size){
  size = size || 300;
  /* Labels sit outside the rings, so the viewBox is padded horizontally and
     the drawing is inset vertically. Without this the outermost labels clip. */
  const padX = size*0.26, padY = size*0.07;
  const cx = size/2, cy = size/2, R = size*0.345;
  const spokes = groups.flatMap(g => g.ids);
  const n = spokes.length; if (!n) return '';
  const ang = i => (i / n) * Math.PI*2 - Math.PI/2;
  const pt = (i, r) => [cx + Math.cos(ang(i))*r, cy + Math.sin(ang(i))*r];
  const P = [];

  for (let ring = 1; ring <= 4; ring++){
    const r = R * ring/4;
    const d = spokes.map((_,i) => pt(i, r).map(v => v.toFixed(1)).join(',')).join(' ');
    P.push(`<polygon points="${d}" fill="none" stroke="var(--border-2)" stroke-width="${ring===4?1.2:0.7}" opacity="${ring===4?0.9:0.55}"/>`);
  }
  spokes.forEach((_,i) => {
    const [x,y] = pt(i, R);
    P.push(`<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="var(--border)" stroke-width="0.6"/>`);
  });

  const scored = spokes.map(id => scores[id]);
  const val = i => { const v = scored[i]; return v == null ? 1 : v; };
  const shape = spokes.map((_,i) => pt(i, R * ((val(i)-1)/6)).map(v => v.toFixed(1)).join(',')).join(' ');
  P.push(`<polygon points="${shape}" fill="var(--brand)" fill-opacity="0.17" stroke="var(--brand)" stroke-width="2" stroke-linejoin="round"/>`);
  spokes.forEach((id,i) => {
    if (scores[id] == null) return;
    const [x,y] = pt(i, R * ((scores[id]-1)/6));
    P.push(`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="2.6" fill="var(--brand)"/>`);
  });

  let k = 0;
  groups.forEach(g => {
    const mid = k + (g.ids.length - 1)/2; k += g.ids.length;
    const [x,y] = pt(mid, R + size*0.075);
    const anchor = Math.abs(x - cx) < size*0.07 ? 'middle' : (x > cx ? 'start' : 'end');
    const lines = wrapLabel(g.name, 16, 3);
    lines.forEach((line, li) => {
      P.push(`<text x="${x.toFixed(1)}" y="${(y + li*11.5 - (lines.length-1)*5.75).toFixed(1)}" `
           + `text-anchor="${anchor}" font-size="10.5" font-weight="600" fill="var(--text-2)" `
           + `font-family="Archivo,sans-serif">${esc(line)}</text>`);
    });
  });

  return `<svg class="spider" viewBox="${(-padX).toFixed(1)} ${(-padY).toFixed(1)} `
       + `${(size + padX*2).toFixed(1)} ${(size + padY*2).toFixed(1)}" `
       + `role="img" aria-label="Score profile">${P.join('')}</svg>`;
}

/* ---------- render ------------------------------------------------------- */
function render(){
  const sc = screens(), s = current();
  const view = document.getElementById('view');
  view.innerHTML = VIEWING ? viewRecord() : ({
    intro:vIntro, how:vHow, setup:vSetup, personal:vPersonal, pro:vPro,
    reflect:vReflect, physical:vPhysical, results:vResults
  })[s.k](s);

  const done = allIds(S).filter(id => S.scores[id] != null).length;
  const total = allIds(S).length;
  document.getElementById('prog').style.width =
    (VIEWING || !total ? 0 : Math.round(SCREEN / (sc.length - 1) * 100)) + '%';

  const who = document.getElementById('who');
  document.body.classList.toggle('named', !!(S.name && !VIEWING));
  if (S.name && !VIEWING){
    const r = roleById(S.role), d = discById(S.discipline);
    who.innerHTML = `<b>${esc(S.name)}</b>${r ? esc(r.label) + (d ? ' &middot; ' + esc(d.label) : '') : ''}`;
  } else who.innerHTML = '';

  renderNav(s, done, total);
  window.scrollTo(0, 0);
}

function renderNav(s, done, total){
  const box = document.querySelector('#nav .in');
  if (VIEWING){
    box.innerHTML = `<button class="btn ghost" onclick="closeRecord()">Back</button>
      <button class="btn" onclick="window.print()">Save as PDF</button>`;
    return;
  }
  const sc = screens(), last = SCREEN >= sc.length - 1;
  const blocked = s.k === 'setup' && (!S.role || (roleById(S.role).needsDiscipline && !S.discipline) || !S.name.trim());
  let right = '';
  if (s.k === 'results'){
    right = `<button class="btn gold" onclick="commit()">Save this baseline</button>`;
  } else if (s.k === 'intro'){
    right = `<button class="btn" onclick="go(1)">${Object.keys(S.scores).length ? 'Continue' : 'Start'}</button>`;
  } else {
    right = `<button class="btn" onclick="go(${SCREEN+1})" ${blocked?'disabled':''}>Next</button>`;
  }
  const counter = (s.k === 'personal' || s.k === 'pro')
    ? `<div class="count"><b>${done}</b> of ${total} scored</div>` : '';
  box.innerHTML =
    (SCREEN > 0 ? `<button class="btn ghost" onclick="go(${SCREEN-1})">Back</button>` : '')
    + counter + (counter ? '' : '<div class="count"></div>') + right;
}

window.go = function(n){ SCREEN = Math.max(0, Math.min(n, screens().length - 1)); save(); render(); };

/* ---------- results ------------------------------------------------------ */
function summarise(rec){
  const st = rec.scores;
  const pGroups = PERSONAL_TAXONOMY.map(c => ({ name:c.name, ids:c.subs.map(x => x.id) }));
  const prGroups = proPillars(rec).map(p => ({ name:p.name, ids:focusList(p).map(f => f.id) }));
  const vals = ids => ids.map(i => st[i]).filter(v => v != null);
  const scoredAll = allIds(rec).filter(i => st[i] != null);
  return {
    pGroups, prGroups,
    personal: mean(vals(personalIds())),
    professional: mean(vals(proIds(rec))),
    scored: scoredAll.length, total: allIds(rec).length,
    ranked: scoredAll.map(id => ({ id, v:st[id] })).sort((a,b) => a.v - b.v || areaName(a.id).localeCompare(areaName(b.id)))
  };
}

/* 1 maps to 0% of the track, which reads as "not answered" rather than
   "answered 1". Every scored area keeps a visible stub. */

}

  <div class="panel">
    <h2>Highest scored</h2>
    <p style="font-size:13.5px;color:var(--text-2)">Worth naming. Development conversations skew to
    deficits and lose the things that are already carrying you.</p>
    <div class="rows">${high.map(x => rowFor(x,'high')).join('')}</div>
  </div>

  <div class="panel noprint">
    <h2>What do you want to work on?</h2>
    <p style="font-size:13.5px;color:var(--text-2)">Choose up to three. They do not have to be your
    lowest scores and often should not be. Pick what you actually want to move, whether that is the
    thing holding everything else back or simply the thing you have the appetite for right now.
    Three is the limit because more than three is not a plan.</p>
    ${m.ranked.slice(0, 14).map(x => `<div class="pick">
      <input type="checkbox" id="p-${esc(x.id)}" ${S.priorities.includes(x.id)?'checked':''}
        onchange="togglePriority('${x.id}')">
      <label for="p-${esc(x.id)}"><b>${esc(areaName(x.id))}</b>
        <span>${esc(groupName(x.id))} &middot; scored ${x.v}</span></label></div>`).join('')}
    <p style="margin:14px 0 0;font-size:13px;color:var(--text-3)">
      ${S.priorities.length}/3 chosen</p>
  </div>

  <div class="panel noprint">
    <h2>Keep it, or send it</h2>
    <p>Saving keeps the baseline on this device so a later one can be compared against it. The PDF
    and the data file are yours: send either to your Individual Support Guide when you are ready, or
    keep them and bring them with you. There is no step here that happens without you.</p>
    <div style="display:flex;gap:9px;flex-wrap:wrap">
      <button class="btn sm" onclick="window.print()">Save as PDF</button>
      <button class="btn ghost sm" onclick="downloadData()">Download data file</button>
      <button class="btn ghost sm" onclick="restart()">Start a new baseline</button>
    </div>
  </div>

  ${printBlock(S, m)}`;
}

/* The written material, laid out for the PDF. Hidden on screen because the
   person has just typed it; the reader on the other end has not seen it. */
function printBlock(rec, m){
  const written = [['What brought you here', rec.context]]
    .concat(REFLECT.map(p => [p.q, rec.reflect[p.id]]))
    .filter(([,v]) => (v||'').trim());
  const noted = Object.keys(rec.notes).filter(k => (rec.notes[k]||'').trim());
  if (!written.length && !noted.length && !rec.priorities.length) return '';
  return `<div class="panel pb" style="display:none" id="printonly">
    <h2>In your own words</h2>
    ${written.map(([q,a]) => `<div class="quote"><b>${esc(q)}</b>${nl(a)}</div>`).join('')}
    ${rec.priorities.length ? `<h3 style="margin-top:18px">Chosen to work on</h3>
      <div class="chips">${rec.priorities.map(id => `<span class="chip">${esc(areaName(id))}</span>`).join('')}</div>` : ''}
    ${noted.length ? `<h3 style="margin-top:20px">Notes against areas</h3>
      ${noted.map(id => `<div class="quote"><b>${esc(areaName(id))} &middot; scored ${rec.scores[id] ?? '—'}</b>${nl(rec.notes[id])}</div>`).join('')}` : ''}
  </div>
  <style>@media print{#printonly{display:block!important}}</style>`;
}

/* ---------- reading a saved record --------------------------------------- */
function viewRecord(){
  const rec = VIEWING, m = summarise(rec);
  const keep = S; S = rec;                        // summarise/radar read the active record
  const html = `
  ${printHead(rec)}
  <h1>${esc(rec.name || 'Baseline')}</h1>
  <p class="lede">${new Date(rec.savedAt).toLocaleDateString('en-NZ',{day:'numeric',month:'long',year:'numeric'})}
   &middot; ${esc(roleById(rec.role)?.label || rec.role)}${rec.discipline ? ' &middot; ' + esc(discById(rec.discipline)?.label) : ''}</p>
  <div class="stat">
    <div><div class="dv">${fmt1(m.personal)}</div><div class="lb">Personal average</div></div>
    <div><div class="dv">${fmt1(m.professional)}</div><div class="lb">Professional average</div></div>
    <div><div class="dv">${m.scored}</div><div class="lb">Areas scored</div></div>
  </div>
  <div class="panel"><h2>Personal</h2>${radar(m.pGroups, rec.scores, 320)}</div>
  <div class="panel"><h2>Professional</h2>${radar(m.prGroups, rec.scores, 320)}</div>
  <div class="panel"><h2>Lowest scored</h2><div class="rows">${m.ranked.slice(0,6).map(x => rowFor(x,'low')).join('')}</div></div>
  <div class="panel"><h2>Highest scored</h2><div class="rows">${m.ranked.slice(-5).reverse().map(x => rowFor(x,'high')).join('')}</div></div>
  <div class="panel noprint"><button class="btn ghost sm" onclick="deleteRecord('${rec.id}')">Delete this baseline</button></div>
  ${printBlock(rec, m).replace('style="display:none"','')}`;
  S = keep;
  return html;
}

/* ---------- actions ------------------------------------------------------ */
window.setField = function(k, v){
  S[k] = v;
  save();
  if (k === 'name'){ document.getElementById('who').innerHTML =
    `<b>${esc(S.name)}</b>${roleById(S.role) ? esc(roleById(S.role).label) : ''}`;
    renderNav(current(), 0, 0); return; }
  render();
};
window.setRole = function(id){
  S.role = id;
  if (!roleById(id).needsDiscipline) S.discipline = '';
  save(); render();
};
window.setScore = function(id, n){
  S.scores[id] = (S.scores[id] === n) ? null : n;
  if (S.scores[id] == null) delete S.scores[id];
  save();
  const btns = document.querySelectorAll(`[onclick^="setScore('${id}'"]`);
  btns.forEach((b,i) => b.setAttribute('aria-pressed', String(S.scores[id] === i+1)));
  const done = allIds(S).filter(x => S.scores[x] != null).length;
  renderNav(current(), done, allIds(S).length);
};
window.setNote = function(id, v){ S.notes[id] = v; save(); };
window.addNote = function(id){ openNotes.add(id); render(); };
window.setReflect = function(id, v){ S.reflect[id] = v; save(); };
window.togglePriority = function(id){
  const i = S.priorities.indexOf(id);
  if (i >= 0) S.priorities.splice(i,1);
  else { if (S.priorities.length >= 3){ document.getElementById('p-'+id).checked = false; return; }
         S.priorities.push(id); }
  save(); render();
};

window.loadHealth = function(input){
  const f = input.files && input.files[0]; if (!f) return;
  const err = document.getElementById('health-err');
  const r = new FileReader();
  r.onload = () => {
    try {
      const d = JSON.parse(r.result);
      if (!d.baselines && !d.daily) throw new Error('shape');
      S.health = { meta:d.meta || null, baselines:d.baselines || null,
                   sleep_consistency:d.sleep_consistency || null };
      save(); render();
    } catch(e){
      err.textContent = 'That file could not be read as a health export. It needs to be JSON containing a baselines or daily section.';
    }
  };
  r.onerror = () => { err.textContent = 'That file could not be opened.'; };
  r.readAsText(f);
};

window.commit = function(){
  const all = records();
  const rec = JSON.parse(JSON.stringify(S));
  rec.savedAt = new Date().toISOString();
  const at = all.findIndex(r => r.id === rec.id);
  if (at >= 0) all[at] = rec; else all.push(rec);
  if (!writeJSON(K_RECORDS, all)){
    alert('This device would not store the baseline. Download the data file instead so it is not lost.');
    return;
  }
  alert('Saved to this device. You can reopen it from the first screen.');
  render();
};

window.downloadData = function(){
  const rec = JSON.parse(JSON.stringify(S));
  rec.savedAt = new Date().toISOString();
  rec.framework = { personal:25, professional:proIds(S).length, scale:'1-7' };
  const blob = new Blob([JSON.stringify(rec, null, 2)], { type:'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'baseline-' + (S.name || 'individual').toLowerCase().replace(/[^a-z0-9]+/g,'-')
             + '-' + new Date().toISOString().slice(0,10) + '.json';
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
};

window.restart = function(){
  if (!confirm('Start a new baseline? Anything saved stays saved; this clears the one in progress.')) return;
  S = blank(); openNotes = new Set(); SCREEN = 0; save(); render();
};
window.openRecord = function(id){ VIEWING = records().find(r => r.id === id) || null; render(); };
window.closeRecord = function(){ VIEWING = null; render(); };
window.deleteRecord = function(id){
  if (!confirm('Delete this baseline permanently?')) return;
  writeJSON(K_RECORDS, records().filter(r => r.id !== id));
  VIEWING = null; render();
};

/* ---------- boot --------------------------------------------------------- */
render();

</script>
</body>
</html>
